html/head_include="<meta name=\"description\" content=\"ファイアウォールになって、パケットを仕分けよう。ブラウザで遊べる 1 プレイ 3〜4 分のゲーム。\"><meta property=\"og:type\" content=\"website\"><meta property=\"og:title\" content=\"パケット検問 (PacketBouncer)\"><meta property=\"og:description\" content=\"ファイアウォールになって、パケットを仕分けよう。ブラウザで遊べる 1 プレイ 3〜4 分のゲーム。\"><meta property=\"og:url\" content=\"https://takosasi-dev.github.io/packet-bouncer/\"><meta property=\"og:image\" content=\"https://takosasi-dev.github.io/packet-bouncer/og.png\"><meta name=\"twitter:card\" content=\"summary_large_image\"><meta name=\"theme-color\" content=\"#070b14\"><style>body,#status{background-color:#070b14}body,#canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}#status{background:radial-gradient(ellipse at 50% 42%,#0f1f33 0,#070b14 62%)}#status-splash{display:none}#status::before{content:'パケット検問';font:700 clamp(34px,10vw,64px)/1.2 system-ui,sans-serif;letter-spacing:.08em;color:#e6f1ff;text-shadow:0 0 4px #2ee6b8,0 0 16px rgba(46,230,184,.7),0 0 40px rgba(46,230,184,.35);margin-bottom:36px}#status::after{content:'PACKET BOUNCER';font:600 12px/1 ui-monospace,monospace;letter-spacing:.45em;color:#7b8aa6;margin-top:22px}#status-progress{position:static;-webkit-appearance:none;appearance:none;box-sizing:border-box;width:min(64%,420px);height:12px;border:1px solid #2ee6b8;border-radius:6px;background:#0f182a;box-shadow:0 0 14px rgba(46,230,184,.45);overflow:hidden}#status-progress::-webkit-progress-bar{background:transparent}#status-progress::-webkit-progress-value{background:#2ee6b8;box-shadow:0 0 10px #2ee6b8}#status-progress::-moz-progress-bar{background:#2ee6b8}#status-progress:indeterminate{background:linear-gradient(90deg,transparent,#2ee6b8,transparent) no-repeat #0f182a;background-size:40% 100%;animation:pb-scan 1.2s linear infinite}#status-progress:indeterminate::-moz-progress-bar{background:transparent}@keyframes pb-scan{from{background-position:-60% 0}to{background-position:160% 0}}</style>"
